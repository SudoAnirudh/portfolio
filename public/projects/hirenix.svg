<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Clean Cream Background -->
  <rect width="800" height="450" fill="#FFFDF5"/>

  <!-- Background Dots -->
  <defs>
    <pattern id="dots-hire" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2.5" fill="#0D0D0D" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dots-hire)"/>

  <!-- Big Decorative Pink Sun Circle -->
  <circle cx="600" cy="180" r="130" fill="#FF7A9E" stroke="#0D0D0D" stroke-width="5"/>
  <path d="M 600 50 L 600 20 M 600 310 L 600 340 M 470 180 L 440 180 M 730 180 L 760 180" stroke="#0D0D0D" stroke-width="6" stroke-linecap="round"/>

  <!-- Main Hero Graphic: Charming Candidate Profile Card with Match Stamp -->
  <g transform="translate(180, 80)">
    <!-- Shadow for Card -->
    <rect x="14" y="14" width="280" height="280" rx="16" fill="#0D0D0D"/>
    <!-- Main White Card -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="6"/>

    <!-- Avatar Circle -->
    <circle cx="140" cy="90" r="50" fill="#FFDE59" stroke="#0D0D0D" stroke-width="5"/>
    <!-- Cheerful Eyes and Smile -->
    <circle cx="125" cy="80" r="6" fill="#0D0D0D"/>
    <circle cx="155" cy="80" r="6" fill="#0D0D0D"/>
    <path d="M 125 102 Q 140 118 155 102" stroke="#0D0D0D" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Candidate Body / Shoulders -->
    <path d="M 95 140 C 95 140 110 135 140 135 C 170 135 185 140 185 140" stroke="#0D0D0D" stroke-width="5" stroke-linecap="round"/>

    <!-- Decorative Skill Lines on Card -->
    <rect x="50" y="170" width="180" height="14" rx="7" fill="#B5E635" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="50" y="196" width="130" height="14" rx="7" fill="#38BDF8" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="50" y="222" width="155" height="14" rx="7" fill="#FFDE59" stroke="#0D0D0D" stroke-width="3"/>
  </g>

  <!-- Big Bold Match Badge (Like the 24°C in Weatherly) -->
  <g transform="translate(430, 220) rotate(-6)">
    <!-- Badge Shadow -->
    <rect x="6" y="6" width="220" height="90" rx="10" fill="#0D0D0D"/>
    <!-- Badge Base -->
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#B5E635" stroke="#0D0D0D" stroke-width="5"/>
    <text x="22" y="62" font-family="'Space Grotesk', Impact, sans-serif" font-size="52" font-weight="900" fill="#0D0D0D">98%</text>
    <!-- Star Sticker -->
    <polygon points="180,30 186,45 202,45 190,55 194,70 180,60 166,70 170,55 158,45 174,45" fill="#FFDE59" stroke="#0D0D0D" stroke-width="3"/>
  </g>

  <!-- Floating Sparkles -->
  <polygon points="140,70 144,82 156,86 144,90 140,102 136,90 124,86 136,82" fill="#FFDE59" stroke="#0D0D0D" stroke-width="2.5"/>
</svg>
