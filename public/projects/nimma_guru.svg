<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Clean Cream Background -->
  <rect width="800" height="450" fill="#FFFDF5"/>

  <!-- Background Dots -->
  <defs>
    <pattern id="dots-guru-clean" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2.5" fill="#0D0D0D" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dots-guru-clean)"/>

  <!-- Big Decorative Sunny Burst in Background -->
  <circle cx="580" cy="190" r="130" fill="#FFDE59" stroke="#0D0D0D" stroke-width="5"/>
  <path d="M 580 50 L 580 20 M 580 330 L 580 360 M 440 190 L 410 190 M 720 190 L 750 190" stroke="#0D0D0D" stroke-width="6" stroke-linecap="round"/>

  <!-- Hero Illustration: Friendly Audio Mentor Mascot with Big Headphones -->
  <g transform="translate(180, 90)">
    <!-- Headphone Arch -->
    <path d="M 30 140 A 110 110 0 0 1 250 140" fill="none" stroke="#0D0D0D" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Headphone Ear Pads -->
    <rect x="10" y="115" width="36" height="65" rx="14" fill="#6D4AFF" stroke="#0D0D0D" stroke-width="5"/>
    <rect x="234" y="115" width="36" height="65" rx="14" fill="#6D4AFF" stroke="#0D0D0D" stroke-width="5"/>

    <!-- Head / Face Circle -->
    <circle cx="140" cy="140" r="85" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="6"/>

    <!-- Cheerful Face -->
    <circle cx="110" cy="130" r="8" fill="#0D0D0D"/>
    <circle cx="170" cy="130" r="8" fill="#0D0D0D"/>
    <!-- Cute Blush -->
    <circle cx="95" cy="145" r="8" fill="#FF7A9E"/>
    <circle cx="185" cy="145" r="8" fill="#FF7A9E"/>
    <!-- Smiling Mouth -->
    <path d="M 120 155 Q 140 175 160 155" stroke="#0D0D0D" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Graduation Cap / Guru Motif on Top -->
    <polygon points="140,25 210,50 140,75 70,50" fill="#B5E635" stroke="#0D0D0D" stroke-width="5"/>
    <line x1="210" y1="50" x2="210" y2="80" stroke="#0D0D0D" stroke-width="4"/>
    <circle cx="210" cy="85" r="5" fill="#FF7A9E"/>
  </g>

  <!-- Sound Waves (Pop-art colorful sound bars on the right) -->
  <g transform="translate(480, 140)">
    <rect x="0" y="50" width="16" height="60" rx="8" fill="#38BDF8" stroke="#0D0D0D" stroke-width="4"/>
    <rect x="28" y="20" width="16" height="120" rx="8" fill="#FF7A9E" stroke="#0D0D0D" stroke-width="4"/>
    <rect x="56" y="0" width="16" height="160" rx="8" fill="#B5E635" stroke="#0D0D0D" stroke-width="4"/>
    <rect x="84" y="30" width="16" height="100" rx="8" fill="#6D4AFF" stroke="#0D0D0D" stroke-width="4"/>
    <rect x="112" y="60" width="16" height="40" rx="8" fill="#FFDE59" stroke="#0D0D0D" stroke-width="4"/>
  </g>

  <!-- Big Bold Neo Metric Stamp (Like 24°C in Weatherly) -->
  <g transform="translate(470, 310)">
    <rect x="5" y="5" width="190" height="65" rx="8" fill="#0D0D0D"/>
    <rect x="0" y="0" width="190" height="65" rx="8" fill="#38BDF8" stroke="#0D0D0D" stroke-width="4"/>
    <text x="26" y="46" font-family="'Space Grotesk', Impact, sans-serif" font-size="38" font-weight="900" fill="#0D0D0D">ಕನ್ನಡ AI</text>
  </g>
</svg>
