<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Clean Cream Background -->
  <rect width="800" height="450" fill="#FFFDF5"/>

  <!-- Subtle Neo-Brutalist Grid Lines -->
  <defs>
    <pattern id="grid-k8s" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0D0D0D" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-k8s)"/>

  <!-- Background Decorative Shapes (Matching the Weatherly Sun/Shapes vibe) -->
  <!-- Giant Soft Violet Geometric Backdrop -->
  <circle cx="260" cy="225" r="140" fill="#FFDE59" stroke="#0D0D0D" stroke-width="5"/>
  <path d="M 260 85 L 260 45 M 260 365 L 260 405 M 120 225 L 80 225 M 400 225 L 440 225 M 160 125 L 130 95 M 360 325 L 390 355 M 160 325 L 130 355 M 360 125 L 390 95" stroke="#0D0D0D" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Hero Graphic: Bold Neo-Brutalist Kubernetes Ship Helm & Cloud Pods -->
  <!-- Cluster Pod Cloud (Sky Blue with Thick Black Outline) -->
  <path d="M 340 260 C 320 260 300 240 310 210 C 300 170 330 140 370 140 C 390 100 450 100 480 130 C 510 110 560 130 560 170 C 600 180 610 220 590 260 Z" 
        fill="#38BDF8" stroke="#0D0D0D" stroke-width="6" stroke-linejoin="round"/>

  <!-- Big Kubernetes Helm Wheel in Front -->
  <g transform="translate(300, 225)">
    <!-- 7 Helm Spokes -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#0D0D0D" stroke-width="8" stroke-linecap="round"/>
    <line x1="-70" y1="-40" x2="70" y2="40" stroke="#0D0D0D" stroke-width="8" stroke-linecap="round"/>
    <line x1="-70" y1="40" x2="70" y2="-40" stroke="#0D0D0D" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Outer Helm Circle -->
    <circle cx="0" cy="0" r="58" fill="#B5E635" stroke="#0D0D0D" stroke-width="6"/>
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="38" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="5"/>
    <!-- Center Eye / Hub -->
    <circle cx="0" cy="0" r="16" fill="#0D0D0D"/>
    <circle cx="-3" cy="-3" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Cute Neo-Brutalist Pod Nodes (Floating on the right) -->
  <g transform="translate(510, 160)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="5"/>
    <circle cx="24" cy="30" r="10" fill="#B5E635" stroke="#0D0D0D" stroke-width="3"/>
    <line x1="44" y1="24" x2="110" y2="24" stroke="#0D0D0D" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="36" x2="85" y2="36" stroke="#0D0D0D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(540, 240)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#FF7A9E" stroke="#0D0D0D" stroke-width="5"/>
    <circle cx="24" cy="30" r="10" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
    <line x1="44" y1="24" x2="110" y2="24" stroke="#0D0D0D" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="36" x2="90" y2="36" stroke="#0D0D0D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bold Neo Metric / Stamp (Like the 24°C in Weatherly) -->
  <g transform="translate(480, 310)">
    <rect x="4" y="4" width="160" height="52" fill="#0D0D0D"/>
    <rect x="0" y="0" width="160" height="52" fill="#B5E635" stroke="#0D0D0D" stroke-width="4"/>
    <text x="18" y="36" font-family="'Space Grotesk', Impact, sans-serif" font-size="32" font-weight="900" fill="#0D0D0D">99.9%</text>
    <circle cx="135" cy="26" r="8" fill="#0D0D0D"/>
  </g>
</svg>
