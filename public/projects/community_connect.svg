<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Clean Cream Background -->
  <rect width="800" height="450" fill="#FFFDF5"/>

  <!-- Background Dots -->
  <defs>
    <pattern id="dots-connect-clean" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2.5" fill="#0D0D0D" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dots-connect-clean)"/>

  <!-- Big Violet Sun Circle on Left -->
  <circle cx="240" cy="210" r="130" fill="#6D4AFF" stroke="#0D0D0D" stroke-width="5"/>

  <!-- Hero Graphic: Illustrated City Map Card with Big Location Pin -->
  <g transform="translate(180, 95)">
    <!-- Map Base Card -->
    <rect x="12" y="12" width="270" height="230" rx="18" fill="#0D0D0D"/>
    <rect x="0" y="0" width="270" height="230" rx="18" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="6"/>

    <!-- Map Roads / Grid Lines -->
    <line x1="0" y1="90" x2="270" y2="90" stroke="#FFE8EE" stroke-width="26"/>
    <line x1="0" y1="90" x2="270" y2="90" stroke="#0D0D0D" stroke-width="3" stroke-dasharray="10 8"/>

    <line x1="140" y1="0" x2="140" y2="230" stroke="#FFE8EE" stroke-width="26"/>
    <line x1="140" y1="0" x2="140" y2="230" stroke="#0D0D0D" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- Park Block -->
    <rect x="25" y="125" width="85" height="75" rx="10" fill="#B5E635" stroke="#0D0D0D" stroke-width="3"/>

    <!-- Giant Map Pin -->
    <g transform="translate(140, 90)">
      <!-- Pin Shadow -->
      <ellipse cx="0" cy="30" rx="18" ry="8" fill="#0D0D0D" opacity="0.2"/>
      
      <!-- Pin Head -->
      <path d="M 0 25 C -25 -5 -30 -30 0 -45 C 30 -30 25 -5 0 25 Z" fill="#FF7A9E" stroke="#0D0D0D" stroke-width="5"/>
      <circle cx="0" cy="-20" r="10" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
    </g>
  </g>

  <!-- Big Checkmark / Resolved Badge on Right -->
  <g transform="translate(500, 120)">
    <circle cx="65" cy="65" r="60" fill="#B5E635" stroke="#0D0D0D" stroke-width="5"/>
    <path d="M 45 65 L 60 80 L 90 45" stroke="#0D0D0D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Big Bold Neo Metric Stamp (Like 24°C in Weatherly) -->
  <g transform="translate(470, 280)">
    <rect x="5" y="5" width="190" height="70" rx="8" fill="#0D0D0D"/>
    <rect x="0" y="0" width="190" height="70" rx="8" fill="#FFDE59" stroke="#0D0D0D" stroke-width="4"/>
    <text x="24" y="50" font-family="'Space Grotesk', Impact, sans-serif" font-size="44" font-weight="900" fill="#0D0D0D">GPS AI</text>
  </g>
</svg>
