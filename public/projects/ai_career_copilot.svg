<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Clean Cream Background -->
  <rect width="800" height="450" fill="#FFFDF5"/>

  <!-- Background Stripes -->
  <defs>
    <pattern id="diag-career-clean" width="30" height="30" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#0D0D0D" stroke-width="1.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#diag-career-clean)"/>

  <!-- Big Sun Backdrop on Right -->
  <circle cx="560" cy="180" r="140" fill="#FF7A9E" stroke="#0D0D0D" stroke-width="5"/>

  <!-- Hero Illustration: Rocket Ship Blasting Off from Resume Sheet -->
  <g transform="translate(180, 110)">
    <!-- Resume Paper Card in Background -->
    <rect x="10" y="10" width="180" height="230" rx="14" fill="#0D0D0D"/>
    <rect x="0" y="0" width="180" height="230" rx="14" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="5"/>
    <rect x="25" y="25" width="70" height="14" rx="4" fill="#0D0D0D"/>
    <rect x="25" y="50" width="130" height="8" rx="4" fill="#6D4AFF"/>
    <rect x="25" y="70" width="110" height="8" rx="4" fill="#B5E635"/>
    <rect x="25" y="90" width="125" height="8" rx="4" fill="#FFDE59"/>
    <!-- Stamp on Resume -->
    <rect x="35" y="130" width="110" height="45" rx="6" fill="#F4FCE3" stroke="#0D0D0D" stroke-width="3"/>
    <text x="50" y="160" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#0D0D0D">HIRED!</text>
  </g>

  <!-- Big Rocket Ship in Front -->
  <g transform="translate(380, 70) rotate(15)">
    <!-- Rocket Flames -->
    <polygon points="40,200 60,260 80,200" fill="#FFDE59" stroke="#0D0D0D" stroke-width="4"/>
    <polygon points="50,200 60,240 70,200" fill="#FF7A9E"/>

    <!-- Rocket Body -->
    <path d="M 60 20 C 30 70 30 140 30 190 L 90 190 C 90 140 90 70 60 20 Z" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="6"/>
    <!-- Fins -->
    <polygon points="30,150 0,195 30,195" fill="#38BDF8" stroke="#0D0D0D" stroke-width="5"/>
    <polygon points="90,150 120,195 90,195" fill="#38BDF8" stroke="#0D0D0D" stroke-width="5"/>
    <!-- Nosecone -->
    <path d="M 60 20 C 45 45 38 70 38 80 L 82 80 C 82 70 75 45 60 20 Z" fill="#6D4AFF" stroke="#0D0D0D" stroke-width="4"/>
    <!-- Porthole Window -->
    <circle cx="60" cy="120" r="18" fill="#38BDF8" stroke="#0D0D0D" stroke-width="4"/>
    <circle cx="56" cy="116" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Big Bold Neo Metric Stamp (Like 24°C in Weatherly) -->
  <g transform="translate(480, 290)">
    <rect x="5" y="5" width="190" height="70" rx="8" fill="#0D0D0D"/>
    <rect x="0" y="0" width="190" height="70" rx="8" fill="#FFDE59" stroke="#0D0D0D" stroke-width="4"/>
    <text x="24" y="50" font-family="'Space Grotesk', Impact, sans-serif" font-size="44" font-weight="900" fill="#0D0D0D">99 ATS</text>
  </g>
</svg>
